      - name: Build debug APK
        working-directory: ChainloomAndroid
        run: gradle :app:assembleDebug --stacktrace

      - name: Verify APK exists
        run: test -f ChainloomAndroid/app/build/outputs/apk/debug/app-debug.apk

      - name: Upload Chainloom APK
        uses: actions/upload-artifact@v4
        with:
          name: Chainloom-debug-apk
          path: ChainloomAndroid/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
